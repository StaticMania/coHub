<!-- Community Statistics Section -->
<section
  class="community-stats"
  id="stats"
>
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <div class="section-title">
          <h2>Our Growing Community</h2>
          <p>Join thousands of professionals who choose coHub as their workspace destination</p>
        </div>
        <div class="stats-container">
          <div
            class="stat-item"
            data-aos="fade-up"
          >
            <div class="stat-number">
              <span
                class="counter"
                data-target="5000"
                >0</span
              >
              <span class="plus">+</span>
            </div>
            <h3>Active Members</h3>
          </div>

          <div
            class="stat-item"
            data-aos="fade-up"
            data-aos-delay="100"
          >
            <div class="stat-number">
              <span
                class="counter"
                data-target="25"
                >0</span
              >
            </div>
            <h3>Locations</h3>
          </div>

          <div
            class="stat-item"
            data-aos="fade-up"
            data-aos-delay="200"
          >
            <div class="stat-number">
              <span
                class="counter"
                data-target="150"
                >0</span
              >
              <span class="plus">+</span>
            </div>
            <h3>Startups Launched</h3>
          </div>

          <div
            class="stat-item"
            data-aos="fade-up"
            data-aos-delay="300"
          >
            <div class="stat-number">
              <span
                class="counter"
                data-target="1200"
              >
                0
              </span>
              <span class="plus">+</span>
            </div>
            <h3>Events Hosted</h3>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
