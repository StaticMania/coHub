<!-- Community Section -->
<section class="section community-pro">
  <div class="container">
    <div class="row align-items-center">
      <div
        class="col-lg-6"
        data-aos="fade-right"
      >
        <img
          src="images/home-3/community-space.jpg"
          alt="community"
          class="img-fluid"
        />
      </div>
      <div
        class="col-lg-6"
        data-aos="fade-left"
      >
        <div class="community-content">
          <h2>Join Our Thriving Community</h2>
          <p>Connect with like-minded professionals, entrepreneurs, and creators in our vibrant workspace community.</p>
          <div class="stats-container">
            <div
              class="stat-item"
              data-aos="fade-up"
            >
              <div class="stat-number">
                <span
                  class="counter"
                  data-target="5000"
                  >0</span
                >
                <span class="plus">+</span>
              </div>
              <h3>Active Members</h3>
            </div>

            <div
              class="stat-item"
              data-aos="fade-up"
              data-aos-delay="100"
            >
              <div class="stat-number">
                <span
                  class="counter"
                  data-target="25"
                  >0</span
                >
              </div>
              <h3>Locations</h3>
            </div>

            <div
              class="stat-item"
              data-aos="fade-up"
              data-aos-delay="200"
            >
              <div class="stat-number">
                <span
                  class="counter"
                  data-target="150"
                  >0</span
                >
                <span class="plus">+</span>
              </div>
              <h3>Startups Launched</h3>
            </div>

            <div
              class="stat-item"
              data-aos="fade-up"
              data-aos-delay="300"
            >
              <div class="stat-number">
                <span
                  class="counter"
                  data-target="1200"
                >
                  0
                </span>
                <span class="plus">+</span>
              </div>
              <h3>Events Hosted</h3>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
